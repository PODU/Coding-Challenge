<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Invaders — Coding Challenge #63</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #05060a;
        color: #e6edf3;
        font-family: monospace;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
      }
      canvas {
        background: #0b0f1a;
        border: 1px solid #1f2937;
        image-rendering: pixelated;
        max-width: 100%;
        height: auto;
      }
      .hint { opacity: 0.6; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <canvas id="game" width="800" height="600"></canvas>
      <div class="hint">Move: ← → / A D &nbsp;·&nbsp; Fire: Space / ↑ &nbsp;·&nbsp; Start/Restart: Enter</div>
    </div>
    <script type="module" src="./dist/bundle.js"></script>
  </body>
</html>
