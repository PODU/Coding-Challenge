{{define "title"}}New{{end}}
{{define "content"}}
<form method="POST" action="/">
  <label for="content">Content</label>
  <textarea id="content" name="content" placeholder="Paste your text here…" autofocus required></textarea>

  <div class="row">
    <div>
      <label for="expires_in">Expiry</label>
      <select id="expires_in" name="expires_in">
        <option value="never">Never</option>
        <option value="10m">10 minutes</option>
        <option value="1h">1 hour</option>
        <option value="24h">1 day</option>
        <option value="168h">1 week</option>
      </select>
    </div>
    <div>
      <label for="language">Syntax</label>
      <select id="language" name="language">
        {{range .Languages}}<option value="{{.Token}}">{{.Label}}</option>{{end}}
      </select>
    </div>
    <div>
      <button type="submit">Create paste</button>
    </div>
  </div>
</form>
{{end}}
