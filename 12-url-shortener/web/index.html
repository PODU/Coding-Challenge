<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 40rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5;
    }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: .5rem; margin: 1.5rem 0; }
    input[type=url] { flex: 1; padding: .6rem .7rem; font-size: 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1rem; word-break: break-all; }
    .error { color: #c0392b; }
    a { font-weight: 600; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <p>Paste a long URL and get a short one back.</p>
  <form id="form">
    <input id="url" type="url" placeholder="https://example.com/very/long/path" required />
    <button type="submit">Shorten</button>
  </form>
  <div id="result"></div>

  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.textContent = '';
      result.className = '';
      const url = document.getElementById('url').value.trim();
      try {
        const res = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) {
          result.className = 'error';
          result.textContent = 'Error: ' + (data.error || res.status);
          return;
        }
        result.innerHTML =
          'Short URL: <a href="' + data.short_url + '">' + data.short_url + '</a>';
      } catch (err) {
        result.className = 'error';
        result.textContent = 'Request failed: ' + err;
      }
    });
  </script>
</body>
</html>
