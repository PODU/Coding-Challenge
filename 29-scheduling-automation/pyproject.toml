[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler"
version = "1.0.0"
description = "CalDAV-backed scheduling automation with a pure free-slot engine (Coding Challenge #29)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Coding Challenge #29" }]
dependencies = [
    "caldav>=1.3",
    "icalendar>=5.0",
    "recurring-ical-events>=2.1",
    "python-dateutil>=2.8",
    "requests-oauthlib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic[email]>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "freezegun>=1.4",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
scheduler = "scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/Query() defaults are the idiomatic pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["scheduler"]
ignore_missing_imports = true
