[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cczipcrack"
version = "1.0.0"
description = "Educational ZIP password cracker (Coding Challenge #66)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Coding Challenge #66" }]
keywords = ["zip", "password", "cracker", "education", "security"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
# WinZip AES support. ZipCrypto works on the stdlib alone.
aes = ["pyzipper>=0.3"]
dev = ["pytest>=7", "pyzipper>=0.3"]

[project.scripts]
cczipcrack = "cczipcrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
