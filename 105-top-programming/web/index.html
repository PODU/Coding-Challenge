<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Top Programming Stories</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; background: #0f1115; color: #e6e6e6;
    }
    header {
      padding: 1rem 1.5rem; background: #1b1f27; border-bottom: 1px solid #2a2f3a;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    .controls { display: flex; gap: .5rem; align-items: center; margin-left: auto; flex-wrap: wrap; }
    .controls input, .controls select {
      background: #0f1115; color: #e6e6e6; border: 1px solid #2a2f3a;
      border-radius: 6px; padding: .35rem .5rem; font-size: .85rem;
    }
    #status { font-size: .8rem; color: #8a93a6; }
    main { max-width: 880px; margin: 0 auto; padding: 1rem 1.5rem; }
    .story {
      padding: .75rem .25rem; border-bottom: 1px solid #20242e;
      display: flex; gap: .9rem; align-items: baseline;
    }
    .score {
      min-width: 3.2rem; text-align: right; font-variant-numeric: tabular-nums;
      font-weight: 700; color: #ff9d5c;
    }
    .meta { color: #8a93a6; font-size: .8rem; margin-top: .15rem; }
    a { color: #6fb3ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: #8a93a6; padding: 2rem 0; text-align: center; }
    .tag {
      display: inline-block; font-size: .68rem; padding: 0 .4rem;
      border: 1px solid #2a2f3a; border-radius: 4px; margin-left: .4rem; color: #8a93a6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Top Programming Stories</h1>
    <div class="controls">
      <input id="q" type="text" placeholder="keyword filter" />
      <input id="minScore" type="number" min="0" placeholder="min score" style="width:6.5rem" />
      <select id="type">
        <option value="">all types</option>
        <option value="story">story</option>
        <option value="job">job</option>
        <option value="poll">poll</option>
      </select>
      <span id="status">loading...</span>
    </div>
  </header>
  <main><div id="list" class="empty">loading...</div></main>
  <script src="app.js"></script>
</body>
</html>
