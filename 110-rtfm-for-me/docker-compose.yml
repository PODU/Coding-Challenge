# Brings up Redis Stack only (Redis + RediSearch + vector search). The app reads
# the Anthropic key from the host environment -- never from this file.
services:
  redis:
    image: redis/redis-stack:latest
    container_name: rtfm-redis
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   # RedisInsight UI
    volumes:
      - rtfm-redis-data:/data

volumes:
  rtfm-redis-data:
