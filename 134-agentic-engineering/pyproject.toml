[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-agent-loop"
version = "1.0.0"
description = "Agentic Engineering Graph — autonomous coding loop orchestrator (Coding Challenge #134)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
lint = ["ruff>=0.6"]
dev = ["pytest>=8.0"]

[project.scripts]
agentloop = "agentloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
