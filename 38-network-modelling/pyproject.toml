[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netmodel"
version = "1.0.0"
description = "A command-line network modelling tool for IP networks (OSPF routing, demand flow, single-link failure analysis)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Coding Challenge #38" }]
keywords = ["networking", "ospf", "dijkstra", "routing", "modelling"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
netmodel = "netmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
