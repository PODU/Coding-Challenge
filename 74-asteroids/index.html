<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteroids — Coding Challenge #74</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: monospace;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        min-height: 100%;
        padding: 16px;
        box-sizing: border-box;

      canvas {
        background: #000;
        border: 1px solid #333;
        image-rendering: pixelated;
        max-width: 100%;
        height: auto;
      }
      .help {
        opacity: 0.7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <canvas id="game" width="960" height="720"></canvas>
      <div class="help">
        Rotate: &larr;/&rarr; or A/D &nbsp;•&nbsp; Thrust: &uarr;/W &nbsp;•&nbsp;
        Fire: Space &nbsp;•&nbsp; Start/Restart: Enter
      </div>
    </div>
    <script type="module" src="/src/shell/main.ts"></script>
  </body>
</html>
