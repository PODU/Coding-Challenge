<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coding Challenge #36 — Pong</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #050505;
      color: #e8e8e8;
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    h1 { font-size: 18px; font-weight: normal; letter-spacing: 2px; opacity: 0.7; margin: 0; }
    canvas {
      background: #0b0b0b;
      border: 1px solid #2a2a2a;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      max-width: 96vw;
      height: auto;
      image-rendering: pixelated;
    }
    .hint { font-size: 13px; opacity: 0.55; text-align: center; line-height: 1.6; }
    kbd {
      background: #1c1c1c; border: 1px solid #333; border-radius: 4px;
      padding: 1px 6px; font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>PONG</h1>
  <canvas id="game" width="800" height="480"></canvas>
  <div class="hint">
    Left paddle: <kbd>↑</kbd>/<kbd>↓</kbd> or <kbd>W</kbd>/<kbd>S</kbd>
    &nbsp;•&nbsp; Restart after game over: <kbd>Space</kbd>/<kbd>Enter</kbd>
    <br />First to 11 wins. Right paddle is the AI.
  </div>
  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
