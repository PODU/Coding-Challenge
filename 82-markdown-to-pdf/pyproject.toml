[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf"
version = "1.0.0"
description = "Convert Markdown to a paginated PDF using a pure-Python, offline library route (markdown-it-py + reportlab)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Coding Challenges #82" }]
keywords = ["markdown", "pdf", "converter", "reportlab", "markdown-it"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Multimedia :: Graphics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "markdown-it-py>=3.0,<4",
    "reportlab>=4.0,<6",
]

[project.optional-dependencies]
test = ["pytest>=7", "pypdf>=4"]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[project.urls]
Homepage = "https://codingchallenges.substack.com/p/coding-challenge-82-markdown-to-pdf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
