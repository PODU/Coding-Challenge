[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calc"
version = "1.0.0"
description = "A command-line arithmetic calculator (tokenizer -> Pratt parser -> evaluator)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Coding Challenge #7" }]
keywords = ["calculator", "parser", "pratt", "cli", "decimal"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "hypothesis>=6.0"]
dev = ["pytest>=7.0", "hypothesis>=6.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
calc = "calc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/calc"]
