<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uptime Monitor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0f1419; color: #e6edf3; }
  header { padding: 16px 24px; border-bottom: 1px solid #222b33; display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: #8b949e; font-size: 12px; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .card { background: #161b22; border: 1px solid #222b33; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 15px; }
  .target { color: #8b949e; font-size: 12px; word-break: break-all; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .up { background: #0f3d2e; color: #3fb950; }
  .down { background: #4a1f22; color: #f85149; }
  .unknown { background: #30363d; color: #8b949e; }
  .metrics { display: flex; gap: 24px; margin-top: 12px; color: #8b949e; font-size: 12px; }
  .metrics b { color: #e6edf3; font-size: 14px; }
  .bar { display: flex; gap: 2px; margin-top: 12px; height: 28px; }
  .bar span { flex: 1; border-radius: 2px; background: #30363d; }
  .bar span.u { background: #3fb950; }
  .bar span.d { background: #f85149; }
  svg { width: 100%; height: 80px; margin-top: 12px; display: block; }
  a.export { color: #58a6ff; text-decoration: none; font-size: 12px; }
  .muted { color: #8b949e; }
</style>
</head>
<body>
<header>
  <h1>Uptime Monitor</h1>
  <span class="sub">auto-refresh every 15s &middot;
    <a class="export" href="/api/export?format=csv">export CSV</a> &middot;
    <a class="export" href="/api/export?format=json">export JSON</a>
  </span>
</header>
<main id="app"><p class="muted">Loading&hellip;</p></main>

<script>
const fmtMs = d => d == null ? "-" : (d/1e6).toFixed(0) + " ms"; // ns -> ms (history uses ms already)
const statusClass = s => s === "up" ? "up" : s === "down" ? "down" : "unknown";

async function j(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + " -> " + r.status); return r.json(); }

function sparkline(buckets) {
  const pts = buckets.filter(b => b.total > 0);
  if (!pts.length) return '<p class="muted">No data in window.</p>';
  const lat = pts.map(b => b.avg_latency_ms);
  const max = Math.max(...lat, 1), min = Math.min(...lat, 0);
  const W = 600, H = 70, n = pts.length;
  const x = i => (n === 1 ? W/2 : (i/(n-1))*W);
  const y = v => H - ((v - min) / (max - min || 1)) * (H - 8) - 4;
  const d = lat.map((v,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="#58a6ff" stroke-width="2"/>
  </svg><div class="muted">avg RTT range ${min.toFixed(0)}–${max.toFixed(0)} ms across ${n} buckets</div>`;
}

function uptimeBar(buckets) {
  const cells = buckets.map(b => {
    if (b.total === 0) return '<span></span>';
    return '<span class="' + (b.up_ratio >= 0.999 ? 'u' : (b.up_ratio === 0 ? 'd' : 'u')) + '"></span>';
  }).join("");
  return '<div class="bar">' + cells + '</div>';
}

async function render() {
  const app = document.getElementById("app");
  try {
    const monitors = await j("/api/monitors");
    if (!monitors.length) { app.innerHTML = '<p class="muted">No monitors configured.</p>'; return; }
    const to = new Date();
    const from = new Date(to.getTime() - 24*3600*1000);
    const qs = `from=${from.toISOString()}&to=${to.toISOString()}`;
    const cards = await Promise.all(monitors.map(async m => {
      let up = {percent: null}, hist = [];
      try { up = await j(`/api/monitors/${m.id}/uptime?${qs}`); } catch (e) {}
      try { hist = await j(`/api/monitors/${m.id}/history?${qs}&bucket=1h`); } catch (e) {}
      const pct = (up.percent == null || isNaN(up.percent)) ? "—" : up.percent.toFixed(2) + "%";
      return `<div class="card">
        <div class="row">
          <div><div class="name">${m.name}</div><div class="target">${m.kind.toUpperCase()} ${m.target}</div></div>
          <span class="pill ${statusClass(m.status)}">${m.status}</span>
        </div>
        <div class="metrics">
          <div>uptime (24h)<br><b>${pct}</b></div>
          <div>checks<br><b>${up.total ?? 0}</b></div>
          <div>interval<br><b>${m.interval_s}s</b></div>
        </div>
        ${uptimeBar(hist)}
        ${sparkline(hist)}
      </div>`;
    }));
    app.innerHTML = cards.join("");
  } catch (e) {
    app.innerHTML = '<p class="muted">Error: ' + e.message + '</p>';
  }
}
render();
setInterval(render, 15000);
</script>
</body>
</html>
