<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Teleprompter</title>
    <style>
      :root {
        --bg: #07090d;
        --panel: #12151c;
        --panel-2: #1b1f29;
        --text: #f4f6fb;
        --muted: #9aa3b2;
        --accent: #4ea1ff;
        --accent-2: #ff5d6c;
        --line: #2a2f3a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        overflow: hidden;
      }

      header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--panel);
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
      header .spacer { flex: 1; }
      #status {
        font-size: 13px; color: var(--muted); min-height: 16px;
        max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #status[data-kind="error"] { color: var(--accent-2); }

      /* Stage / teleprompter viewport */
      #stage {
        position: relative;
        overflow: hidden;
        background: #000;
      }
      .tp-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .tp-content {
        will-change: transform;
        white-space: pre-wrap;
        word-break: break-word;
        font-weight: 700;
        padding-top: 4vh;
        color: var(--text);
      }
      .tp-content h1, .tp-content h2, .tp-content h3 { margin: 0.4em 0; }
      .tp-content em { font-style: italic; }
      .tp-content code {
        font-family: ui-monospace, "Cascadia Code", monospace;
        background: rgba(255,255,255,0.08); padding: 0 0.2em; border-radius: 4px;
      }
      /* Fixed reading-line indicator (visual only) */
      #stage::after {
        content: "";
        position: absolute;
        left: 0; right: 0; top: 38%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(78,161,255,0.55), transparent);
        pointer-events: none;
      }

      /* Controls panel */
      footer {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px 22px;
        align-items: center;
      }
      .group { display: flex; flex-direction: column; gap: 4px; }
      .group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .row { display: flex; align-items: center; gap: 8px; }
      input[type="range"] { width: 130px; accent-color: var(--accent); }
      select, input[type="text"], textarea {
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px;
      }
      button {
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 600;
      }
      button:hover { border-color: var(--accent); }
      button#playPause { background: var(--accent); color: #04121f; border-color: var(--accent); min-width: 84px; }
      #stage[data-mirrored="true"] ~ footer #mirror { border-color: var(--accent-2); color: var(--accent-2); }
      .value { font-size: 12px; color: var(--muted); min-width: 56px; }

      .script-box { display: flex; flex-direction: column; gap: 4px; flex: 1 1 260px; }
      .script-box textarea { width: 100%; height: 60px; resize: vertical; font-size: 13px; }
      .import-box { display: flex; gap: 6px; align-items: center; }
      .import-box input[type="text"] { width: 240px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Software Teleprompter</h1>
      <div class="import-box">
        <input id="importUrl" type="text" placeholder="Import URL / GitHub .md / Google Doc" />
        <button id="importButton" type="button">Import</button>
      </div>
      <div class="spacer"></div>
      <div id="status" data-kind="info"></div>
    </header>

    <main id="stage" aria-label="Teleprompter display">
      <div class="tp-viewport">
        <div class="tp-content"></div>
      </div>
    </main>

    <footer>
      <div class="row">
        <button id="playPause" type="button">Play</button>
        <button id="reset" type="button">Reset</button>
        <button id="mirror" type="button">Mirror</button>
      </div>

      <div class="group">
        <label for="speed">Speed</label>
        <div class="row">
          <input id="speed" type="range" min="0" max="400" step="5" />
          <span id="speedValue" class="value">—</span>
        </div>
      </div>

      <div class="group">
        <label for="fontFace">Font</label>
        <select id="fontFace">
          <option value='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>Sans</option>
          <option value='Georgia, "Times New Roman", serif'>Serif</option>
          <option value='ui-monospace, "Cascadia Code", "Courier New", monospace'>Mono</option>
        </select>
      </div>

      <div class="group">
        <label for="fontSize">Size</label>
        <input id="fontSize" type="range" min="16" max="160" step="2" />
      </div>

      <div class="group">
        <label for="lineSpacing">Line spacing</label>
        <input id="lineSpacing" type="range" min="1" max="3" step="0.05" />
      </div>

      <div class="group">
        <label for="marginLeft">Left margin</label>
        <input id="marginLeft" type="range" min="0" max="40" step="1" />
      </div>

      <div class="group">
        <label for="marginRight">Right margin</label>
        <input id="marginRight" type="range" min="0" max="40" step="1" />
      </div>

      <label class="row" style="font-size:13px;color:var(--muted);">
        <input id="markdownToggle" type="checkbox" /> Markdown
      </label>

      <div class="script-box">
        <label for="scriptInput" style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;">Script</label>
        <textarea id="scriptInput" placeholder="Type or paste your script…"></textarea>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
