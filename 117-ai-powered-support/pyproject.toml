[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "support-bot"
version = "0.1.0"
description = "AI Powered Support Bot (Coding Challenge #117) — RAG-grounded CLI support assistant on Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Coding Challenges" }]
dependencies = [
    "anthropic>=0.40",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
support-bot = "support_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_bot = ["kb/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
