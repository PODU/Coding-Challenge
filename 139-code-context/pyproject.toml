[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccctx"
version = "1.0.0"
description = "Code Context MCP server — searchable, graph-aware codebase index for AI tools (Coding Challenge #139)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
oracle = ["oracledb>=2.0"]

[project.scripts]
ccctx = "ccctx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccctx = ["oracle/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
